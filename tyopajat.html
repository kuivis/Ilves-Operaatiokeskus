<!doctype html>
<html lang="fi">

<head>

  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#CE5738" />
  <title>Ilvestulet · Työpajat · ilves26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Jost:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --punainen: #CE5738;
      --punainen-dark: #a83f23;
      --metsa: #80884f;
      --forest: #414a2c;
      --meri: #6c7a3f;
      --rusko: #6b4a34;
      --savu: #F5F1E8;
      --kulta: #D39C2F;
      --kulta-bright: #f1b742;
      --ink: #201f1a;
      --ink-2: #5c5a4e;
      --ink-3: #9a978a;
      --card: #ffffff;
      --line: #e6decb;
      --shadow: 0 4px 12px rgba(32, 31, 26, 0.08);
      --shadow-lg: 0 12px 28px rgba(32, 31, 26, 0.15);
      --radius: 1.2rem;
      --radius-sm: 0.8rem;
      --head: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --body: "Jost", "Nunito", -apple-system, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 15px;
      -webkit-tap-highlight-color: transparent;
      background-color: var(--savu);
    }

    body {
      font-family: var(--body);
      background: var(--savu);
      color: var(--ink);
      min-height: 100vh;
      padding: 0 0 6rem 0;
      /* extra space for GoodBarber 72px app footer */
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      line-height: 1.3;
    }

    /* Header & Branding */
    .header {
      background: var(--punainen);
      color: #fff;
      padding: 1.25rem 1rem 2rem 1rem;
      position: relative;
      box-shadow: 0 4px 12px rgba(206, 87, 56, 0.25);
      text-align: center;
    }

    .header::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 0;
      right: 0;
      height: 14px;
      background-image: radial-gradient(circle 8px at 8px -2px, transparent 100%, var(--savu) 100%);
      background-size: 16px 14px;
      background-repeat: repeat-x;
    }

    .header-inner {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-img {
      height: 2.2rem;
      width: auto;
      max-width: 180px;
    }

    .header h1 {
      font-family: var(--head);
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin-top: 0.1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #fff;
    }

    .header p {
      font-size: 0.92rem;
      font-weight: 500;
      opacity: 0.92;
      max-width: 340px;
    }

    /* Main Container */
    .container {
      max-width: 520px;
      margin: 1.5rem auto 0 auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* Controls Bar: Search & Filter Tabs */
    .controls-card {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 2.6rem 0.75rem 2.5rem;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: var(--card);
      font-family: var(--body);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--ink);
      box-shadow: var(--shadow);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--punainen);
      box-shadow: 0 0 0 3px rgba(206, 87, 56, 0.18);
    }

    .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.1rem;
      height: 1.1rem;
      color: var(--ink-3);
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      border: none;
      background: #efe9db;
      color: var(--ink-2);
      font-size: 1.1rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .search-box input:not(:placeholder-shown)~.search-clear {
      opacity: 1;
      pointer-events: auto;
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.3rem;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .filter-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: var(--card);
      border: 1.5px solid var(--line);
      color: var(--ink-2);
      font-family: var(--head);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .tab-btn:active {
      transform: scale(0.95);
    }

    .tab-btn.active {
      background: var(--forest);
      color: #fff;
      border-color: var(--forest);
      box-shadow: 0 2px 8px rgba(65, 74, 44, 0.25);
    }

    .tab-btn.tab-fav.active {
      background: var(--punainen);
      border-color: var(--punainen);
      box-shadow: 0 2px 8px rgba(206, 87, 56, 0.3);
    }

    .tab-count {
      font-size: 0.72rem;
      background: rgba(0, 0, 0, 0.08);
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
      font-weight: 800;
    }

    .tab-btn.active .tab-count {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    /* Section Header */
    .section-title {
      font-family: var(--head);
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--forest);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.4rem 0 0.2rem 0;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid var(--line);
    }

    .section-title svg {
      width: 1.25rem;
      height: 1.25rem;
      fill: none;
      stroke: var(--punainen);
      stroke-width: 2.2;
    }

    /* Accordion List */
    .workshop-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Accordion Card */
    .workshop-card {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }

    .workshop-card.is-favorite {
      border-color: var(--kulta-bright);
      box-shadow: 0 4px 14px rgba(211, 156, 47, 0.2);
    }

    .workshop-card.is-expanded {
      border-color: var(--forest);
    }

    /* Accordion Header (Clickable Trigger) */
    .card-header {
      padding: 0.9rem 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      cursor: pointer;
      user-select: none;
    }

    .card-header-main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .card-title {
      font-family: var(--head);
      font-weight: 800;
      font-size: 1.02rem;
      line-height: 1.28;
      color: var(--ink);
      transition: color 0.2s ease;
    }

    .workshop-card.is-expanded .card-title {
      color: var(--punainen);
    }

    /* Badges row */
    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: #F4EFE4;
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      line-height: 1.2;
    }

    .badge svg {
      width: 0.85rem;
      height: 0.85rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .badge-location {
      background: rgba(108, 122, 63, 0.12);
      color: var(--forest);
      font-weight: 700;
    }

    .badge-signup {
      background: rgba(206, 87, 56, 0.12);
      color: var(--punainen-dark);
      font-weight: 700;
    }

    .badge-fav {
      background: rgba(211, 156, 47, 0.18);
      color: #8a5e00;
      font-weight: 800;
    }

    /* Heart Button */
    .btn-heart {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      border: none;
      background: #F4EFE4;
      color: var(--ink-3);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, color 0.2s ease;
      z-index: 2;
    }

    .btn-heart:active {
      transform: scale(0.82);
    }

    .btn-heart svg {
      width: 1.2rem;
      height: 1.2rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }

    .workshop-card.is-favorite .btn-heart {
      background: rgba(206, 87, 56, 0.12);
      color: var(--punainen);
    }

    .workshop-card.is-favorite .btn-heart svg {
      fill: var(--punainen);
      stroke: var(--punainen);
    }

    /* Chevron indicator */
    .chevron-ic {
      width: 1.2rem;
      height: 1.2rem;
      color: var(--ink-3);
      flex-shrink: 0;
      margin-top: 0.15rem;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .workshop-card.is-expanded .chevron-ic {
      transform: rotate(180deg);
      color: var(--punainen);
    }

    /* Accordion Body (Collapsible Details) */
    .card-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
      opacity: 0;
      border-top: 1px solid transparent;
    }

    .workshop-card.is-expanded .card-body {
      max-height: 800px;
      opacity: 1;
      border-top-color: var(--line);
    }

    .card-body-inner {
      padding: 0.9rem 1rem 1.1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      background: #FAF7F1;
    }

    .detail-desc {
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--ink);
      white-space: pre-line;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0.7rem 0.85rem;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .detail-item.full-width {
      grid-column: span 2;
    }

    .detail-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-3);
    }

    .detail-val {
      font-family: var(--head);
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--ink);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .empty-state svg {
      width: 3rem;
      height: 3rem;
      color: var(--ink-3);
    }

    .empty-state h3 {
      font-family: var(--head);
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--ink);
    }

    .empty-state p {
      font-size: 0.9rem;
      color: var(--ink-2);
      max-width: 300px;
    }

    /* Toast Message (Positioned above GoodBarber 72px footer bar) */
    .toast {
      position: fixed;
      bottom: calc(72px + 1.2rem);
      left: 50%;
      transform: translateX(-50%) translateY(300%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      background: var(--ink);
      color: #fff;
      font-family: var(--head);
      font-weight: 800;
      font-size: 0.92rem;
      padding: 0.7rem 1.3rem;
      border-radius: 999px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 10000;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease, visibility 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
  </style>
</head>

        "capacity": "ei rajattu",
        "description": "Tekoäly on jo partiossa, mutta miten sen käyttö sopii yhteen partion arvojen kanssa? Tässä workshopissa ei tuijoteta ruutuja vaan keskustellaan: Mitä tekoälyllä voi ja kannattaa tehdä partiossa, ja mihin sitä ei ehkä tulisi käyttää? Mitä tapahtuu itse tekemisen kulttuurille, jos kone tekee leirilogot ja retkikirjeet? Entä miten tekoälyn energian- ja vedenkulutus istuu partion ympäristötavoitteisiin? Pohdimme yhdessä, missä kulkee partiomaisen tekoälyn käytön raja. Puhutaan myös SP:n ohjeistuksista tekoälyn käyttöön. Et tarvitse aiempaa kokemusta tekoälystä – riittää, että sinulla on mielipide tai halu muodostaa sellainen. Sopii kaikille johtajille pesteistä riippumatta.\nTyöpajan pitää Sami “Kuivis” Kuivasaari, Ilves26 nettimestari",

      {

      },
      {
        "id": "wp_46",
        "timeslot": "Työpaja 2: klo 17:30–18:30",

        "description": "Suomen partiolaisten uutta strategiaa on valmisteltu keväästä 2025 ja se hyväksytään jäsenkokouksessa syksyllä 2026. Nyt sinulla on erinomainen mahdollisuus päästä kuulemaan uuden strategian kärjet ja jalkauttamisen suunnitelmat. Ehkä vaihdetaan muutama sana myös siitä, miten strategian valmisteluprosessi on edennyt ja minkälaista vaikuttavuutta uudelta strategialta odotetaan.\nStrategiaa on esittelemässä Suomen partiolaisten 1. vpj Jenna Kankaanpää.",
        "signup": "Ei"
      },
      {
        "id": "wp_48",
        "timeslot": "Non-stop: klo 14:30–18:30",
        "title": "Samoajien osaamispolku (Kaikki samoajat osallistuvat)",
        "location": "lähtöpaikka Nikkarilaakson portin ja johtajakahvilan välissä",
        "capacity": "ei rajattu",
        "description": "Tiedätkö, mikä on osaamismerkki ja mitä hyötyä sinulle siitä voi olla? Miten voit yhdistää opinnot ja partiopestin? Osaatko kertoa partiossa hankkimastasi osaamisesta vaikkapa kesätyöhakemuksessa?\nOsaamispolulla tutustut partion osaamistyökaluihin. Polun päätteeksi saat Merkkihenkilö-pinssin huiviisi! Sen mukana kulkee paljon tietoa, josta voi olla sinulle tulevaisuudessa suurta hyötyä.\nJos haluat osallistua muihin työpajoihin, osaamispolun pikaversion voi käydä läpi myöhemmin saman päivän aikana Johtajahuollon samoajateltalla.",
        "signup": "Ei"
      },
      {
        "id": "wp_49",
        "timeslot": "Non-stop: klo 14:30–18:30",
        "title": "Vaeltajien ja aikuisten osaamispolku",
        "location": "lähtö Koulutuksen kohtauspaikan teltta leirisuoralla",
        "capacity": "ei rajattu",
        "description": "Tiedätkö, mikä on osaamismerkki ja mitä hyötyä sinulle siitä voi olla? Miten voit yhdistää opinnot ja partiopestin? Osaatko kertoa partiossa hankkimastasi osaamisesta vaikkapa työhakemuksessa? Miten tuet ryhmääsi osaamisen sanoittamisessa?\nOsaamispolulla tutustut partion osaamistyökaluihin. Polun päätteeksi saat Merkkihenkilö-pinssin huiviisi! Sen mukana kulkee paljon tietoa, josta voi olla sinulle tulevaisuudessa suurta hyötyä.",
        "signup": "Ei"
      }
    ];
  </script>
  <script>
    /**
     * Ilvestulet Workshop App Engine
     * Handles filtering, accordion expansion, search, and persistent favorites.
     */
    const STORAGE_KEY_FAVS = 'ilves26_tyopajat_favorites_v1';

    let favoritesSet = new Set();
    let currentTab = 'all';
    let searchQuery = '';
    let expandedSet = new Set();

    // Load Favorites from LocalStorage
    function loadFavorites() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_FAVS);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            favoritesSet = new Set(parsed);
          }
        }
      } catch (e) {
        console.warn('LocalStorage error loading favorites', e);
      }
    }

    // Save Favorites
    function saveFavorites() {
      try {
        localStorage.setItem(STORAGE_KEY_FAVS, JSON.stringify(Array.from(favoritesSet)));
      } catch (e) {
        console.warn('LocalStorage error saving favorites', e);
      }
    }

    // Toggle Favorite
    function toggleFavorite(id, title) {
      if (favoritesSet.has(id)) {
        favoritesSet.delete(id);
        showToast(`Poistettu suosikeista`, '🤍');
      } else {
        favoritesSet.add(id);
        showToast(`Lisätty suosikkeihin: ${title.slice(0, 24)}...`, '❤️');
      }
      saveFavorites();
      updateTabCounts();
      renderWorkshops();

      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(30);
      }
    }

    // Toast notification helper
    let toastTimeout;
    function showToast(msg, icon = '❤️') {
      const toastMsg = document.getElementById('toastMsg');
      const toastText = document.getElementById('toastText');
      const toastIcon = document.getElementById('toastIcon');

      toastText.textContent = msg;
      toastIcon.textContent = icon;
      toastMsg.classList.add('show');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastMsg.classList.remove('show');
      }, 2800);
    }

    // Update Tab Count Badges
    function updateTabCounts() {
      const all = WORKSHOPS_DATA.length;
      const t1 = WORKSHOPS_DATA.filter(w => w.timeslot.includes('Työpaja 1')).length;
      const t2 = WORKSHOPS_DATA.filter(w => w.timeslot.includes('Työpaja 2')).length;
      const nonstop = WORKSHOPS_DATA.filter(w => w.timeslot.includes('Non-stop')).length;
      const favs = favoritesSet.size;

      document.getElementById('countAll').textContent = all;
      document.getElementById('countT1').textContent = t1;
      document.getElementById('countT2').textContent = t2;
      document.getElementById('countNonstop').textContent = nonstop;
      document.getElementById('countFav').textContent = favs;
    }

    // Group workshops according to user instruction: Työpaja 1 first, then Työpaja 2, then Non-stop
    function getGroupedWorkshops(filteredList) {
      const groups = [
        { title: 'Työpaja 1: klo 14:30–15:30', key: 't1', items: [] },
        { title: 'Työpaja 2: klo 17:30–18:30', key: 't2', items: [] },
        { title: 'Non-stop: klo 14:30–18:30', key: 'nonstop', items: [] }
      ];

      filteredList.forEach(w => {
        if (w.timeslot.includes('Työpaja 1')) {
          groups[0].items.push(w);
        } else if (w.timeslot.includes('Työpaja 2')) {
          groups[1].items.push(w);
        } else if (w.timeslot.includes('Non-stop')) {
          groups[2].items.push(w);
        } else {
          groups[0].items.push(w);
        }
      });

      return groups.filter(g => g.items.length > 0);
    }

    // Render workshops list
    function renderWorkshops() {
      const container = document.getElementById('workshopContainer');
      container.innerHTML = '';

      // Filter list
      let filtered = WORKSHOPS_DATA.filter(w => {
        // Tab filter
        if (currentTab === 't1' && !w.timeslot.includes('Työpaja 1')) return false;
        if (currentTab === 't2' && !w.timeslot.includes('Työpaja 2')) return false;
        if (currentTab === 'nonstop' && !w.timeslot.includes('Non-stop')) return false;
        if (currentTab === 'fav' && !favoritesSet.has(w.id)) return false;

        // Search query filter
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchTitle = w.title.toLowerCase().includes(q);
          const matchLoc = w.location.toLowerCase().includes(q);
          const matchDesc = w.description.toLowerCase().includes(q);
          const matchTime = w.timeslot.toLowerCase().includes(q);
          if (!matchTitle && !matchLoc && !matchDesc && !matchTime) return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        const isFavTab = currentTab === 'fav';
        container.innerHTML = `
      <div class="empty-state">
        <svg><use href="#i-${isFavTab ? 'heart' : 'search'}"/></svg>
        <h3>${isFavTab ? 'Ei suosikkeja vielä' : 'Ei työpajoja hakuehdoilla'}</h3>
        <p>${isFavTab ? 'Napsauta työpajan sydänkuvaketta (❤️) lisätäksesi sen suosikkeihisi!' : 'Kokeile toista hakusanaa tai valitse toinen välilehti.'}</p>
      </div>
    `;
        return;
      }

      const groups = getGroupedWorkshops(filtered);

      groups.forEach(group => {
        // Section header (only if showing 'all' or 'fav' tabs, or multiple groups present)
        if (currentTab === 'all' || currentTab === 'fav' || groups.length > 1) {
          const secHeader = document.createElement('h2');
          secHeader.className = 'section-title';
          secHeader.innerHTML = `
        <svg><use href="#i-clock"/></svg>
        <span>${escapeHtml(group.title)}</span>
      `;
          container.appendChild(secHeader);
        }

        const listDiv = document.createElement('div');
        listDiv.className = 'workshop-list';

        group.items.forEach(w => {
          const isFav = favoritesSet.has(w.id);
          const isExpanded = expandedSet.has(w.id);

          const card = document.createElement('div');
          card.className = 'workshop-card'
            + (isFav ? ' is-favorite' : '')
            + (isExpanded ? ' is-expanded' : '');
          card.id = `card_${w.id}`;

          const signupBadge = w.signup === 'Kyllä'
            ? `<span class="badge badge-signup"><svg><use href="#i-check-square"/></svg> Ennakkoilm.</span>`
            : '';
          const favBadge = isFav
            ? `<span class="badge badge-fav">❤️ Suosikki</span>`
            : '';

          card.innerHTML = `
        <div class="card-header" role="button" tabindex="0" aria-expanded="${isExpanded ? 'true' : 'false'}">
          <div class="card-header-main">
            <h3 class="card-title">${escapeHtml(w.title)}</h3>
            <div class="card-badges">
              <span class="badge badge-location"><svg><use href="#i-map-pin"/></svg> ${escapeHtml(w.location)}</span>
              <span class="badge"><svg><use href="#i-users"/></svg> ${escapeHtml(w.capacity)}</span>
              ${signupBadge}
              ${favBadge}
            </div>
          </div>
          <button type="button" class="btn-heart" aria-label="Lisää suosikkeihin: ${escapeHtml(w.title)}">
            <svg><use href="#i-heart"/></svg>
          </button>
          <svg class="chevron-ic"><use href="#i-chevron-down"/></svg>
        </div>

        <div class="card-body">
          <div class="card-body-inner">
            <p class="detail-desc">${escapeHtml(w.description)}</p>
            <div class="detail-grid">
              <div class="detail-item">
                <span class="detail-label">Aika & Ryhmä</span>
                <span class="detail-val">${escapeHtml(w.timeslot)}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Sijainti</span>
                <span class="detail-val">${escapeHtml(w.location)}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Osallistujia</span>
                <span class="detail-val">${escapeHtml(w.capacity)}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Ilmoittautuminen</span>
                <span class="detail-val">${escapeHtml(w.signup)}</span>
              </div>
            </div>
          </div>
        </div>
      `;

          // Header click toggles accordion expansion
          const headerEl = card.querySelector('.card-header');
          headerEl.addEventListener('click', (e) => {
            // If clicked on heart button, handle heart toggle
            if (e.target.closest('.btn-heart')) {
              e.stopPropagation();
              toggleFavorite(w.id, w.title);
              return;
            }
            toggleAccordion(w.id);
          });

          headerEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              toggleAccordion(w.id);
            }
          });

          listDiv.appendChild(card);
        });

        container.appendChild(listDiv);
      });
    }

    // Accordion toggle handler
    function toggleAccordion(id) {
      if (expandedSet.has(id)) {
        expandedSet.delete(id);
      } else {
        expandedSet.add(id);
      }
      renderWorkshops();
    }

    // Event Listeners for Search & Filter Tabs
    const searchInput = document.getElementById('searchInput');
    const btnClearSearch = document.getElementById('btnClearSearch');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderWorkshops();
    });

    btnClearSearch.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      renderWorkshops();
      searchInput.focus();
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        currentTab = btn.dataset.tab;
        renderWorkshops();
      });
    });

    // HTML sanitizer helper
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Initialization
    loadFavorites();
    updateTabCounts();
    renderWorkshops();
  </script>
</body>

</html>
